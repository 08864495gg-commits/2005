<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>薪資與資遣費計算器</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 480px;
    }
    h2 {
      margin-top: 0;
      color: #333;
      text-align: center;
      margin-bottom: 24px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #555;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }
    input:focus {
      outline: none;
      border-color: #0066cc;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #0066cc;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #0052a3;
    }
    .result {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 2px dashed #eee;
    }
    .result-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 15px;
      color: #444;
    }
    .result-item.total {
      font-size: 18px;
      font-weight: bold;
      color: #d9534f;
      border-top: 1px solid #eee;
      padding-top: 12px;
      margin-top: 12px;
    }
  </style>
</head>
<body>

<div class="card">
  <h2>薪資與資遣費試算器</h2>
  
  <div class="form-group">
    <label for="monthlySalary">月薪 (NT$)</label>
    <input type="number" id="monthlySalary" placeholder="請輸入月薪" min="0">
  </div>
  
  <div class="form-group">
    <label for="startDate">入職日期</label>
    <input type="date" id="startDate">
  </div>
  
  <div class="form-group">
    <label for="endDate">離職日期（最後在職日）</label>
    <input type="date" id="endDate">
  </div>
  
  <button onclick="calculate()">開始計算</button>

  <div class="result" id="resultBlock" style="display: none;">
    <div class="result-item">
      <span>年資累計：</span>
      <span id="seniorityText">-</span>
    </div>
    <div class="result-item">
      <span>資遣費（新制）：</span>
      <span id="severancePay">-</span>
    </div>
    <div class="result-item">
      <span>離職當月應發薪資：</span>
      <span id="lastMonthSalary">-</span>
    </div>
    <div class="result-item total">
      <span>預估總金額：</span>
      <span id="totalAmount">-</span>
    </div>
  </div>
</div>

<script>
  function calculate() {
    const salary = parseFloat(document.getElementById('monthlySalary').value);
    const startVal = document.getElementById('startDate').value;
    const endVal = document.getElementById('endDate').value;

    if (!salary || !startVal || !endVal) {
      alert('請填寫完整的月薪與日期！');
      return;
    }

    const startDate = new Date(startVal);
    const endDate = new Date(endVal);

    if (endDate < startDate) {
      alert('離職日期不可早於入職日期！');
      return;
    }

    // 計算總天數與年資
    const timeDiff = endDate.getTime() - startDate.getTime();
    const totalDays = Math.floor(timeDiff / (1000 * 3600 * 24)) + 1; // 包含首尾兩天
    const years = totalDays / 365.25; // 考慮閏年平均天數

    // 1. 資遣費計算 (新制：每滿1年給0.5個月，上限6個月)
    let severanceBase = years * 0.5;
    if (severanceBase > 6) severanceBase = 6;
    const severancePay = Math.round(salary * severanceBase);

    // 2. 離職當月薪資計算 (以月薪/30算出日薪，按離職當月實際在職天數計算)
    const endDay = endDate.getDate();
    const dailySalary = salary / 30;
    const lastMonthSalary = Math.round(dailySalary * endDay);

    // 3. 年資文字顯示
    const displayYears = Math.floor(totalDays / 365);
    const displayMonths = Math.floor((totalDays % 365) / 30);
    const displayDays = (totalDays % 365) % 30;

    // 顯示結果
    document.getElementById('seniorityText').innerText = `${displayYears} 年 ${displayMonths} 個月 ${displayDays} 天 (共 ${totalDays} 天)`;
    document.getElementById('severancePay').innerText = `NT$ ${severancePay.toLocaleString()}`;
    document.getElementById('lastMonthSalary').innerText = `NT$ ${lastMonthSalary.toLocaleString()} (${endDate.getMonth() + 1}月在職 ${endDay} 天)`;
    document.getElementById('totalAmount').innerText = `NT$ ${(severancePay + lastMonthSalary).toLocaleString()}`;
    
    document.getElementById('resultBlock').style.display = 'block';
  }
</script>

</body>
</html>
